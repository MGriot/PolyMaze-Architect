name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c 'import sys; sys.path.insert(0, "src"); import polymaze; print(polymaze.__version__)')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $version in src/polymaze/__init__.py"
            exit 1
          fi
      - run: pip install pytest
      # Core tests need no UI toolkit (enforced by tests/test_core_is_ui_free.py)
      - run: pytest -q

  desktop:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import sys; sys.path.insert(0, "src"); import polymaze; print(polymaze.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Windows installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./tools/build_windows.ps1 -Python python -RequireInstaller
          New-Item -ItemType Directory -Force dist/upload | Out-Null
          Move-Item dist/installer/* dist/upload/

      - name: Bundle (macOS / Linux)
        if: runner.os != 'Windows'
        run: pyinstaller packaging/pyinstaller/polymaze.spec --noconfirm

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/upload
          hdiutil create -volname "PolyMaze Architect" -srcfolder dist/PolyMazeArchitect.app -ov -format UDZO \
            "dist/upload/PolyMazeArchitect-${{ steps.ver.outputs.version }}-macos-$(uname -m).dmg"

      - name: Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/upload
          tar -czf "dist/upload/PolyMazeArchitect-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" -C dist PolyMazeArchitect

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/upload/*
          if-no-files-found: error

  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      # Kivy 2.3.1 requires cython<=3.0.11 (its pyproject build-system pin)
      - run: pip install buildozer==1.6.0 cython==3.0.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-1.6.0-${{ hashFiles('buildozer.spec') }}

      - name: Version
        run: echo "VERSION=$(python -c 'import sys; sys.path.insert(0, "src"); import polymaze; print(polymaze.__version__)')" >> "$GITHUB_ENV"

      - name: Signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/polymaze-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          trim() { printf '%s' "$1" | tr -d '\r\n'; }
          export P4A_RELEASE_KEYSTORE="$ks"
          export P4A_RELEASE_KEYSTORE_PASSWD="$(trim "$ANDROID_KEYSTORE_PASSWORD")"
          export P4A_RELEASE_KEYALIAS="$(trim "$ANDROID_KEY_ALIAS")"
          export P4A_RELEASE_KEYALIAS_PASSWD="$(trim "$ANDROID_KEY_PASSWORD")"
          yes | buildozer android release
          rm -f "$ks"
          ls -l bin
          apk=$(ls bin/*release*.apk | grep -v unsigned | head -n1)
          [ -n "$apk" ] || { echo "::error::No signed release APK in bin/"; exit 1; }
          apksigner=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p upload
          cp "$apk" "upload/PolyMazeArchitect-${VERSION}-android.apk"

      - name: Debug APK (no signing key configured)
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::Android signing secrets are not set, so this is a debug APK. Run tools/setup_android_signing.ps1 to ship signed releases."
          yes | buildozer android debug
          mkdir -p upload
          cp "$(ls bin/*-debug.apk | head -n1)" "upload/PolyMazeArchitect-${VERSION}-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: upload/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          python - "$GITHUB_REF_NAME" > release-notes.md <<'EOF'
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"CHANGELOG.md has no '## [{tag}]' section")
          v = tag[1:]
          print(m.group(1).strip())
          print(f"""
          ## Downloads

          | Platform | File |
          | --- | --- |
          | Windows 10/11 (x64) | `PolyMazeArchitect-Setup-{v}.exe` (installer) or `PolyMazeArchitect-{v}-windows-x64-portable.zip` |
          | macOS (Apple Silicon) | `PolyMazeArchitect-{v}-macos-arm64.dmg` |
          | Linux (x86_64) | `PolyMazeArchitect-{v}-linux-x86_64.tar.gz` |
          | Android 7.0+ | `PolyMazeArchitect-{v}-android.apk` |

          The Windows and macOS builds aren't code-signed: on Windows click **More info → Run anyway**; on macOS right-click the app → **Open** the first time. On Android allow **Install unknown apps**. SHA-256 checksums are in `SHA256SUMS.txt`.
          """)
          EOF
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: PolyMaze Architect ${{ github.ref_name }}
          body_path: release-notes.md
          files: assets/*
          fail_on_unmatched_files: true
